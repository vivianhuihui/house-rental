<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學租圈｜大學生租屋資訊交流平台</title>
<style>
:root{
  /* ===== 色票（以附圖為主）===== */
  --peach:#F4BAA3; --beige:#F4F0E2; --sky:#A6C8E2; --palette-blue:#619DC6;
  /* ===== 13 個色彩角色（Design System）===== */
  --brand:#3A6D93;          /* 品牌／主要操作 */
  --brand-hover:#2F5C7E;    /* 滑鼠移入 */
  --brand-pressed:#244A66;  /* 按下 */
  --focus:#4F87B0;          /* 鍵盤焦點 */
  --error:#B23A2E;          /* 錯誤 */
  --success:#2E6F55;        /* 成功 */
  --brand-tint:#E3EEF7;     /* 品牌淡底 */
  --text:#1F2E3D;           /* 主要文字 */
  --text-2:#52606E;         /* 輔助文字 */
  --surface:#FFFFFF;        /* 表面 */
  --bg:#F4F0E2;             /* 背景 */
  --border:#7D8995;         /* 欄位邊界 */
  --disabled:#E4E1D6;       /* 停用底色 */
  /* ===== 元件用別名（連到上方角色）===== */
  --paper:var(--bg); --card:var(--surface); --ink:var(--text); --ink2:var(--text-2); --muted:var(--text-2);
  --line:#E3DDCC; --accent:var(--brand); --peach-soft:#FBE6DD; --accent-soft:var(--peach-soft);
  --leaf:var(--success); --leaf-soft:#E2F0E9; --gold:#C26A48; --warn:var(--error); --blue:var(--brand); --blue-soft:var(--brand-tint);
  /* ===== 字體（Noto Sans TC・字級/行高 px）===== */
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --fs-display:44px; --lh-display:60px;   /* Display・Bold */
  --fs-heading:28px; --lh-heading:40px;   /* Heading・Bold */
  --fs-sub:19px;     --lh-sub:28px;       /* Subheading・Bold */
  --fs-body:15px;    --lh-body:24px;      /* Body・Regular */
  --fs-label:14px;   --lh-label:22px;     /* Label・Medium */
  --fs-caption:12px; --lh-caption:18px;   /* Caption・Regular */
  /* ===== 間距（4px 基準）===== */
  --sp-4:4px; --sp-8:8px; --sp-12:12px; --sp-16:16px; --sp-24:24px; --sp-32:32px; --sp-48:48px;
  --r:14px; --shadow:0 1px 2px rgba(31,46,61,.06),0 6px 18px rgba(31,46,61,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100%}
body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;font-size:15px;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3{line-height:1.3;letter-spacing:.01em}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.hide{display:none!important}
p,li,td,h1,h2,h3,span,div{overflow-wrap:anywhere}

/* header */
header.top{position:sticky;top:0;z-index:40;background:rgba(244,240,226,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;text-decoration:none;white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
nav.main{display:flex;gap:2px;margin-left:8px;flex:1;min-width:0}
nav.main a{padding:7px 11px;border-radius:999px;text-decoration:none;color:var(--ink2);font-size:14px;white-space:nowrap}
nav.main a.on{background:var(--brand);color:#fff}
nav.main a:hover{background:var(--brand-tint);color:var(--brand-pressed)}
nav.main a.on:hover{background:var(--brand-hover);color:#fff}
.userbox{display:flex;gap:8px;align-items:center;margin-left:auto}
.menu-btn{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.dot{position:relative}
.dot[data-n]:after{content:attr(data-n);position:absolute;top:-4px;right:-6px;background:var(--error);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;line-height:16px}
@media (max-width:900px){
  nav.main{display:none;position:fixed;top:62px;left:0;right:0;flex-direction:column;background:var(--paper);padding:10px 14px 16px;border-bottom:1px solid var(--line);margin:0;box-shadow:var(--shadow)}
  nav.main.open{display:flex}
  nav.main a{padding:12px 14px;border-radius:10px;font-size:15px}
  .menu-btn{display:block}
  .userbox .uname{display:none}
}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;border:1px solid transparent;transition:.15s;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-hover)}
.btn.pri:active{background:var(--brand-pressed)}
.btn.dark{background:var(--brand-pressed);color:#fff}
.btn.dark:hover{background:var(--brand-hover)}
.btn.ghost{border-color:var(--border);background:var(--surface);color:var(--brand-pressed)}
.btn.ghost:hover{background:var(--brand-tint)}
.btn.ghost:active{background:#CFE0EE}
.btn:focus-visible,a:focus-visible,button:focus-visible,input[type=checkbox]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn.leaf{background:var(--leaf);color:#fff}
.btn.warn{background:var(--warn);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{background:var(--disabled);color:var(--text-2);border-color:var(--disabled);cursor:not-allowed}
.btn.block{width:100%}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:5px}
label.f em{color:var(--error);font-style:normal}
.in,select.in,textarea.in{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;outline:none;min-width:0}
.in:focus{border-color:var(--focus);box-shadow:0 0 0 3px rgba(79,135,176,.25)}
.in:disabled{background:var(--disabled);color:var(--text-2)}
textarea.in{resize:vertical;min-height:90px}
.err{color:var(--error);font-size:12.5px;margin-top:4px}
.in.bad{border-color:var(--error);background:#FDF1EE}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.chk input{margin-top:4px;accent-color:var(--brand);width:16px;height:16px;flex-shrink:0}

/* cards & chips */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12.5px;background:#ECE6D4;color:var(--text);white-space:nowrap}
.chip.leaf{background:var(--leaf-soft);color:var(--leaf)}
.chip.acc{background:var(--peach-soft);color:var(--error)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.gray{background:var(--disabled);color:var(--text-2)}
button.chip{border:1px solid transparent;cursor:pointer}
button.chip.on{background:var(--brand);color:#fff}
.tag-wrap{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px}
.b-pending{background:var(--peach-soft);color:#8C4228}
.b-ok{background:var(--leaf-soft);color:var(--leaf)}
.b-bad{background:#F9E1DC;color:var(--error)}
.b-gray{background:var(--disabled);color:var(--text-2)}
.b-blue{background:var(--blue-soft);color:var(--blue)}

/* page */
main{min-height:calc(100vh - 62px);padding-bottom:60px}
.page-head{padding:28px 0 18px}
.page-head h1{font-size:26px}
.page-head p{color:var(--ink2);margin-top:4px}
.section-t{font-size:18px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:8px}

/* hero */
.hero{background:var(--sky);color:var(--text);border-radius:0 0 28px 28px;padding:34px 0 30px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:var(--peach)}
.hero:after{content:"";position:absolute;right:120px;bottom:-90px;width:180px;height:180px;border-radius:50%;border:26px solid var(--palette-blue)}
.hero .wrap{position:relative;z-index:1}
.hero h1{font-size:32px;max-width:560px}
.hero h1 b{color:var(--brand-pressed);background:linear-gradient(transparent 62%,var(--peach) 62%)}
.hero p{color:var(--text);margin-top:8px;max-width:520px}
.searchbar{margin-top:20px;background:var(--card);color:var(--ink);border-radius:18px;padding:14px;display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr auto;gap:10px;box-shadow:0 10px 30px rgba(36,74,102,.18)}
@media (max-width:860px){.searchbar{grid-template-columns:1fr 1fr}.searchbar .q{grid-column:1/-1}.searchbar .btn{grid-column:1/-1}}
@media (max-width:640px){.hero h1{font-size:25px}.hero:after{display:none}}
.tagfilter{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.tagfilter button{padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.6);color:var(--text);font-size:13px;border:1px solid rgba(255,255,255,.9)}
.tagfilter button:hover{background:#fff}
.tagfilter button.on{background:var(--brand-pressed);color:#fff;border-color:var(--brand-pressed)}

.banner{margin:18px 0 0;padding:14px 16px;border-radius:var(--r);background:var(--peach-soft);display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:#E6DFCB;border-radius:999px;padding:3px}
.seg button{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* listing cards (photo wall) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer;transition:.18s;min-width:0}
.lcard:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(36,74,102,.14)}
.photo{position:relative;aspect-ratio:4/3;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.photo svg{width:78%;height:auto;margin-bottom:-2px}
.photo .ptag{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.fav{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:17px;color:var(--error)}
.lcard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.price{font-size:20px;font-weight:800}
.price small{font-size:12.5px;font-weight:500;color:var(--muted)}
.match{font-size:12px;color:var(--leaf);font-weight:700}

/* map */
.map{position:relative;height:430px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
 background:
 linear-gradient(90deg,transparent 48%,#fff 48%,#fff 50%,transparent 50%) 0 0/100% 100%,
 linear-gradient(0deg,transparent 58%,#fff 58%,#fff 60%,transparent 60%) 0 0/100% 100%,
 linear-gradient(35deg,transparent 64%,#fff 64%,#fff 65.5%,transparent 65.5%) 0 0/100% 100%,
 repeating-linear-gradient(0deg,#E6E0CD 0 1px,transparent 1px 38px),
 repeating-linear-gradient(90deg,#E6E0CD 0 1px,transparent 1px 38px),var(--beige)}
.zone{position:absolute;border-radius:50%;background:rgba(166,200,226,.35);border:2px dashed var(--palette-blue);transform:translate(-50%,-50%)}
.zone span{position:absolute;left:50%;top:-12px;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--brand-pressed);background:var(--beige);padding:0 6px;border-radius:6px;white-space:nowrap}
.pin{position:absolute;transform:translate(-50%,-100%);background:var(--brand-pressed);color:#fff;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.pin:after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--brand-pressed);border-bottom:0}
.pin:hover{background:var(--brand);z-index:3}
.pin:hover:after{border-top-color:var(--brand)}
.school{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:800;background:var(--peach);color:var(--text);padding:4px 10px;border-radius:8px}
@media (max-width:560px){.map{height:340px}.pin{font-size:11px;padding:2px 7px}}

/* about */
.about{margin-top:44px;display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
@media (max-width:760px){.about{grid-template-columns:1fr}}
.about .card h3{margin-bottom:8px}
.feature{display:flex;gap:12px;align-items:flex-start}
.feature b.n{width:30px;height:30px;border-radius:9px;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;flex-shrink:0}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:13px}

/* detail */
.detail{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-top:20px}
@media (max-width:820px){.detail{grid-template-columns:1fr}}
.detail .photo{border-radius:var(--r);aspect-ratio:16/10}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kv div{background:var(--bg);border-radius:10px;padding:10px 12px}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-size:15px}

/* tabs */
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{padding:10px 16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--brand-pressed);border-color:var(--brand)}

/* checklist */
.cl-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.cl-item+.cl-item{margin-top:8px}
.cl-item.done{background:#F1F7F3;border-color:#C9E0D3}
.cl-item.done .nm{text-decoration:line-through;color:var(--muted)}
.cl-item .nm{flex:1;min-width:0}
.cl-item.pri{border-left:4px solid var(--peach)}
.x{width:28px;height:28px;border-radius:8px;color:var(--muted);flex-shrink:0}
.x:hover{background:var(--peach-soft);color:var(--error)}
.progress{height:8px;background:var(--disabled);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:.3s}
.hint{padding:12px 14px;border-radius:12px;background:var(--blue-soft);color:var(--blue);font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.know{padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.know+.know{margin-top:10px}
.sticky-act{position:sticky;bottom:12px;margin-top:18px;background:var(--brand-pressed);color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;box-shadow:0 10px 26px rgba(0,0,0,.2);z-index:5}

.sticky-act .btn.pri{background:var(--peach);color:var(--text)}
.sticky-act .btn.pri:hover{background:#F8D3C3}
/* record form */
.fsec{margin-top:16px}
.fsec>h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.fsec>h3 .num{width:24px;height:24px;border-radius:7px;background:var(--brand);color:#fff;font-size:12px;display:grid;place-items:center}
.stars{display:inline-flex;gap:2px}
.stars button{font-size:22px;line-height:1;color:#D3CCB8;padding:2px}
.stars button.on{color:var(--gold)}
.rate-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px}
@media (max-width:640px){.rate-grid{grid-template-columns:1fr}}
.rate-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.tri{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0}
.tri button{padding:5px 11px;font-size:13px;color:var(--ink2)}
.tri button.ok{background:var(--success);color:#fff}
.tri button.bad{background:var(--error);color:#fff}
.check-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px}
.thumbs div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#eee}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px}
.upload{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:12px;padding:18px;color:var(--ink2);cursor:pointer;background:#fff;text-align:center}
.save-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:20px}
@media (max-width:560px){.save-bar .btn{flex:1 1 100%}}

/* records */
.rec{display:flex;gap:14px;align-items:center}
.rec .mini{width:76px;height:76px;border-radius:12px;flex-shrink:0;overflow:hidden;background:var(--sky);display:grid;place-items:center;font-size:26px}
.rec .mini img{width:100%;height:100%;object-fit:cover}
.rec .info{flex:1;min-width:0}
.rec.sel{outline:2px solid var(--brand);outline-offset:-1px}
.rec-list>*+*{margin-top:10px}
@media (max-width:560px){.rec{flex-wrap:wrap}.rec .acts{width:100%}}

/* compare */
.cmp-head{display:grid;gap:10px}
.cmp-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;position:relative;min-width:0}
.cmp-card.final{border:2px solid var(--success);background:#F1F7F3}
.cmp-card .no{position:absolute;top:-10px;left:12px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px}
.dim{padding:12px 0;border-bottom:1px solid var(--line)}
.dim h4{font-size:14px;margin-bottom:8px;color:var(--ink2)}
.dim-vals{display:grid;gap:8px}
.dv{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;min-width:0}
.dv.best{background:var(--leaf-soft);outline:2px solid var(--leaf)}
.dv .bar{height:6px;background:var(--disabled);border-radius:999px;margin-top:6px;overflow:hidden}
.dv .bar i{display:block;height:100%;background:var(--palette-blue)}
.dv.best .bar i{background:var(--leaf)}
.dv .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols-1{grid-template-columns:1fr}.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.cols-3,.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.cols-2,.cols-3,.cols-4{grid-template-columns:minmax(0,1fr)}}

/* forum */
.post{padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);cursor:pointer;box-shadow:var(--shadow)}
.post+.post{margin-top:10px}
.post h3{font-size:16px;margin:6px 0 4px}
.post p{color:var(--ink2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmt{padding:12px 0;border-bottom:1px dashed var(--line)}
.cmt.pending{opacity:.6}
.layout-side{display:grid;grid-template-columns:1fr 300px;gap:20px}
@media (max-width:880px){.layout-side{grid-template-columns:1fr}}
.preview-box{border:2px dashed var(--line);border-radius:var(--r);padding:16px;background:#fff}

/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(31,46,61,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.demo{background:var(--peach-soft);border:1px dashed var(--peach);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:14px}

.adm{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 62px)}
.adm aside{background:var(--brand-pressed);color:#E3EEF7;padding:18px 12px}

.adm aside a.on,.adm aside a:hover{background:rgba(255,255,255,.16);color:#fff}

after.record=()=>{
  const inp=$('#ph-in');if(!inp)return;
  inp.addEventListener('change',e=>{[...e.target.files].slice(0,8).forEach(f=>compress(f,url=>{RF.photos.push(url);$('#thumbs').innerHTML=thumbsHTML()}));inp.value=''})
};
function compress(file,cb){
  const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const m=640,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};img.src=rd.result};rd.readAsDataURL(file)
}
function saveRecord(kind){
  const f=document.querySelector('form[data-form=record]');
  RF.listingId=f.listingId.value;RF.manual={name:f.mname.value.trim(),addr:f.maddr.value.trim(),rent:f.mrent.value};
  RF.date=f.date.value;RF.time=f.time.value;RF.impression=f.impression.value.trim();RF.prosText=f.prosText.value.trim();RF.consText=f.consText.value.trim();RF.notes=f.notes.value.trim();
  document.querySelectorAll('[data-err]').forEach(e=>e.textContent='');document.querySelectorAll('.in.bad').forEach(e=>e.classList.remove('bad'));
  if(kind!=='draft'){
    const errs=[];
    if(RF.mode==='pick'&&!RF.listingId){errs.push('listing');f.listingId.classList.add('bad')}
    if(RF.mode==='manual'&&!RF.manual.name){errs.push('mname');f.mname.classList.add('bad')}
    if(!RF.date){errs.push('date');f.date.classList.add('bad')}
    if(!RF.overall)errs.push('overall');
    if(errs.length){errs.forEach(k=>{const e=document.querySelector(`[data-err=${k}]`);if(e)e.textContent='此為必填欄位'});toast('儲存失敗：資料不完整，請填寫必填欄位');document.querySelector(`[data-err=${errs[0]}]`).scrollIntoView({behavior:'smooth',block:'center'});return}
  }
  RF.status=kind==='draft'?'draft':'saved';RF.updated=new Date().toISOString();RF.owner=owner();
  if(!RF.id){RF.id=nid('R');RF.created=RF.updated;S.records.unshift(RF)}else{const i=S.records.findIndex(r=>r.id===RF.id);S.records[i]=RF}
  if(kind==='compare'){const o=owner();S.compare[o]=S.compare[o]||[];if(!S.compare[o].includes(RF.id)){if(S.compare[o].length>=4){toast('比較清單已滿 4 筆，未加入比較')}else S.compare[o].push(RF.id)}}
  save();
  if(kind==='draft'){toast('已儲存為草稿');go('/records');return}
  modal(`<h3>✓ 儲存成功</h3><p class="muted">「${esc(rName(RF))}」已${kind==='compare'?'儲存並加入比較清單':'儲存到我的看房紀錄'}。接下來要做什麼？</p>

}

function vCompare(){
  const o=owner();
  const ids=(S.compare[o]||[]).filter(id=>S.records.some(r=>r.id===id&&r.owner===o&&r.status==='saved'));S.compare[o]=ids;
  const recs=ids.map(id=>S.records.find(r=>r.id===id));
  if(recs.length<2)return `<div class="wrap" style="max-width:700px"><div class="page-head"><h1>看房紀錄比較</h1></div>
   <div class="card" style="text-align:center;padding:40px"><div style="font-size:40px">⚖️</div><p>請先在「我的看房紀錄」勾選 <b>2～4 筆</b>要比較的紀錄（目前 ${recs.length} 筆）。</p><br><a class="btn pri" href="#/records">前往勾選</a></div></div>`;
  const n=recs.length;const fin=S.finalPick[o];
  const rows=[['rent','月租金',r=>rRent(r),'low'],['overall','整體印象',r=>r.overall,'high'],...DIMS.map(([k,t])=>[k,t,r=>r.ratings[k]||0,'high'])];
  const maxRent=Math.max(...recs.map(rRent),1);
  const bestCount={};recs.forEach(r=>bestCount[r.id]=0);
  const dims=rows.map(([k,t,fn,dir])=>{
    const vals=recs.map(fn);const valid=vals.filter(v=>v>0);const best=valid.length?(dir==='low'?Math.min(...valid):Math.max(...valid)):null;
    recs.forEach((r,i)=>{if(vals[i]===best&&best!==null)bestCount[r.id]++});
    return `<div class="dim"><h4>${t}${dir==='low'?' <span class="tiny muted">（越低越好）</span>':''}</h4><div class="dim-vals cols-${n}">

function compareSummary(){

function exportImage(){
  const o=owner();const recs=(S.compare[o]||[]).map(id=>S.records.find(r=>r.id===id)).filter(Boolean);
  const W=Math.max(720,200+recs.length*220),rowH=34,rows=[['月租金',r=>money(rRent(r))],['整體印象',r=>r.overall+'/5'],...DIMS.map(([k,t])=>[t,r=>(r.ratings[k]||'-')+'/5']),['優點',r=>r.pros.slice(0,3).join('、')||'—'],['缺點',r=>r.cons.slice(0,3).join('、')||'—']];
  const H=120+rows.length*rowH+40;const c=document.createElement('canvas');c.width=W*2;c.height=H*2;const g=c.getContext('2d');g.scale(2,2);
  g.fillStyle='#F4F0E2';g.fillRect(0,0,W,H);g.fillStyle='#1F2E3D';g.font='bold 22px sans-serif';g.fillText('學租圈｜看房紀錄比較',24,40);
  g.font='13px sans-serif';g.fillStyle='#52606E';g.fillText(new Date().toLocaleDateString(),24,62);
  const cw=(W-200)/recs.length;g.font='bold 14px sans-serif';
  recs.forEach((r,i)=>{g.fillStyle=S.finalPick[o]===r.id?'#2E6F55':'#1F2E3D';g.fillText((i+1)+'. '+rName(r).slice(0,12)+(S.finalPick[o]===r.id?' ✓':''),180+i*cw,98)});
  rows.forEach(([t,fn],ri)=>{const y=120+ri*rowH;g.fillStyle=ri%2?'#FFFFFF':'#E3EEF7';g.fillRect(16,y,W-32,rowH);g.fillStyle='#52606E';g.font='13px sans-serif';g.fillText(t,28,y+22);g.fillStyle='#1F2E3D';recs.forEach((r,i)=>g.fillText(String(fn(r)).slice(0,16),180+i*cw,y+22))});
  const a=document.createElement('a');a.download='看房比較.png';a.href=c.toDataURL('image/png');a.click();toast('已下載比較圖片')
}

function loginAs(u){
  S.session=u.id;
  const g='guest';
  let moved=0;S.records.forEach(r=>{if(r.owner===g){r.owner=u.id;moved++}});
  if(S.checklists[g]&&S.checklists[g].length&&(!S.checklists[u.id]||!S.checklists[u.id].length))S.checklists[u.id]=S.checklists[g];delete S.checklists[g];
  if(S.carry[g]&&S.carry[g].length){S.carry[u.id]=S.carry[g];delete S.carry[g]}
  if(S.compare[g]){S.compare[u.id]=[...new Set([...(S.compare[u.id]||[]),...S.compare[g]])].slice(0,4);delete S.compare[g]}
  if(S.viewed[g]){S.viewed[u.id]=[...new Set([...S.viewed[g],...(S.viewed[u.id]||[])])];delete S.viewed[g]}
  save();return moved
}

    const id=f.dataset.id;
    if(id){const p=S.posts.find(x=>x.id===id);Object.assign(p,{title,body,cat:f.cat.value,listingId:f.listingId.value,status:'pending',reason:''})}
    else S.posts.unshift({id:nid('P'),uid:u.id,author:u.name,title,body,cat:f.cat.value,listingId:f.listingId.value,status:'pending',created:new Date().toISOString(),likes:0,comments:[]});
    save();
    nextModal=(`<h3>✓ 貼文已送出</h3><p class="muted">貼文將由管理員審核，通過後會公開顯示並通知你；若需修改，會退回給你並附上意見。</p><div class="acts"><button class="btn pri" data-act="close">好的</button></div>`);go('/forum')},
  comment:f=>{const u=cur();if(!u)return needLogin(location.hash.slice(1),'留言需要登入會員。');const b=f.body.value.trim();if(!b)return;
    const p=S.posts.find(x=>x.id===f.dataset.id);p.comments.push({id:nid('C'),uid:u.id,author:u.name,body:b,status:'pending',created:new Date().toISOString()});save();toast('留言已送出，審核通過後顯示');render()},
  ticket:f=>{const e=$('#t-err');if(!f.account.value.trim()||!f.body.value.trim()){e.textContent='請填寫帳號與問題內容';return}if(!f.agree.checked){e.textContent='請勾選已同意服務條款及隱私聲明';return}
    S.tickets.push({id:nid('T'),account:f.account.value.trim(),type:f.type.value,body:f.body.value.trim(),created:new Date().toISOString(),status:'open',reply:''});save();
    nextModal=`<h3>✓ 已送出</h3><p class="muted">客服會確認帳號後，以 email 回覆你。</p><div class="acts"><button class="btn pri" data-act="close">好的</button></div>`;render()},
  'admin-login':f=>{const a=S.admins.find(x=>x.id===f.id.value.trim());const e=$('#al-err');
    if(!a){e.textContent='帳號不存在，請重新輸入';return}if(a.pw!==f.pw.value){e.innerHTML='密碼錯誤，請重新輸入。<a href="#/forgot?admin=1">忘記密碼？</a>';return}
    S.admin=true;save();toast('成功登入後台管理系統');render()},
  'adm-search':f=>{admQ=f.q.value.trim();admF=f.f.value;render()},
  'adm-punish':f=>{const u=S.users.find(x=>x.id===f.dataset.id);const k=f.kind.value,r=f.reason.value.trim(),now=new Date().toISOString();let msg='';
    if(k==='none'){msg='審核不違規，維持帳號正常使用'}
    if(k==='warn'){msg='警告：'+r;notify(u.id,'⚠ 警告通知：'+(r||'您的行為違反社群規範，請注意。'))}
    if(k==='temp'){const d=Math.max(1,+f.days.value||7);u.status='suspended';u.until=new Date(Date.now()+d*864e5).toISOString();msg=`暫時停權 ${d} 天：${r}`;notify(u.id,`你的帳號已被暫時停權 ${d} 天。原因：${r||'違反社群規範'}`)}
    if(k==='perm'){u.status='disabled';msg='永久停權（停用帳號）：'+r;notify(u.id,'你的帳號已被永久停權。')}
    u.logs.push({t:now,msg});admLog(`${u.name}：${msg}`);save();toast('已儲存管理紀錄');go('/admin/members')},
  'adm-return':f=>{const p=S.posts.find(x=>x.id===f.dataset.id);p.status='returned';p.reason=f.reason.value.trim();notify(p.uid,`你的貼文〈${p.title}〉需要修改：${p.reason}`);admLog(`退回文章〈${p.title}〉`);save();toast('文章已退回並通知撰寫者');go('/admin/posts')},
  'adm-delpost':f=>{const p=S.posts.find(x=>x.id===f.dataset.id);p.status='deleted';p.reason=f.reason.value.trim();notify(p.uid,`你的貼文〈${p.title}〉因違規已被刪除：${p.reason}`);admLog(`刪除文章〈${p.title}〉：${p.reason}`);save();toast('文章已刪除');go('/admin/posts')},
  'adm-cmt':f=>{const r=f.reason.value.trim();if(!r){toast('請輸入違規原因');f.reason.focus();return}const p=S.posts.find(x=>x.id===f.dataset.p);const c=p.comments.find(x=>x.id===f.dataset.c);c.status='hidden';c.reason=r;notify(c.uid,`你在〈${p.title}〉的留言因違規已被刪除：${r}`);admLog(`刪除留言（${c.author}）：${r}`);save();toast('留言已刪除並通知撰寫者');render()},
  'adm-reply':f=>{const t=S.tickets.find(x=>x.id===f.dataset.id);t.reply=f.reply.value.trim();t.status='replied';const u=S.users.find(x=>x.email===t.account);if(u)notify(u.id,`客服回覆：${t.reply}`);admLog(`客服回覆 ${t.account}`);save();toast('已回覆');render()},
};
document.addEventListener('submit',e=>{const f=e.target;const k=f.dataset.form;if(k&&FORMS[k]){e.preventDefault();FORMS[k](f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='new-check'){e.preventDefault();A['add-check']()}if(e.key==='Enter'&&e.target.id==='m-name'){e.preventDefault();A['cl-add-ok']()}});

render();
</script>
</body>
</html>
